*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;padding-inline:16px;-webkit-font-smoothing:antialiased;position:relative}

:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"stage head" "stage side";grid-template-rows:auto 1fr;gap:20px 48px;padding-block:36px 40px;align-items:start}

.spine{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:3 5;stroke-linecap:round}

.hasflow .spine,.hasflow .pk{opacity:0}

.blk.on .ft{stroke:#FFD966;stroke-width:2.5}

.fcase{fill:none;stroke:#0B0F14;stroke-opacity:.8;stroke-width:5.5;stroke-linejoin:round;stroke-linecap:round}

.lbl line{stroke:var(--line-2);stroke-width:1}

/* opening: a revolving red-and-orange globe that is cut along its latitudes into five slices, one per layer */
#intro{pointer-events:none}
svg.rest #intro{pointer-events:auto;cursor:pointer}
svg.intro .lift{pointer-events:none}
#intro .gb,#intro .lb{stroke-width:.75;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#intro .gb{stroke:color-mix(in oklab,var(--l2f),#000 38%)}
#intro .gtp{stroke:color-mix(in oklab,var(--l2f),#000 30%);stroke-width:.75}

#gsurf path{fill:none;vector-effect:non-scaling-stroke}

#gsurf #gmer{stroke:var(--l4f);stroke-opacity:.4;stroke-width:1}

.again{position:absolute;left:4px;top:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--ground);cursor:pointer;display:grid;place-items:center;padding:0;z-index:2;opacity:.7;transition:opacity .15s,border-color .15s}

/* side panel */
.side h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.rows{display:grid}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 6px;cursor:pointer;border-radius:0}

/* ================= dialog =================
   The header borrows the picture: the area's own pad and icon, on a wash of its layer colour.

.scrim{position:fixed;inset:0;background:rgba(10,13,18,.52);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}

.dpuck{flex:0 0 auto;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin-bottom:7px;background:linear-gradient(135deg,color-mix(in oklab,var(--lcf),#fff 76%),color-mix(in oklab,var(--lcf),#fff 42%));box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--lcf),#fff 20%),inset 0 0 0 5px color-mix(in oklab,var(--lcf),#fff 62%),0 7px 0 -1px color-mix(in oklab,var(--lcf),#000 16%),0 16px 22px -10px color-mix(in oklab,var(--lcf) 60%,transparent)}
.dpuck svg{width:30px;height:30px;fill:none;stroke:color-mix(in oklab,var(--lcf),#000 64%);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.lid{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.dstats:empty{display:none}
.stat{display:inline-flex;align-items:baseline;gap:6px;padding:5px 12px;border-radius:999px;background:color-mix(in oklab,var(--ground) 80%,transparent);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}

.drawer.scrolled .dstats,.drawer.scrolled .dlead{display:none}

.prod .pn{font-weight:600;font-size:15.5px;line-height:1.3;letter-spacing:-.005em;color:var(--ink)}

.prod .badges,.dstats.badges{display:flex;gap:5px;flex-wrap:wrap}

.badge{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--ink-2);white-space:nowrap;font-weight:550}

.note b{color:var(--s-flux);font-weight:600;margin-right:7px}
.dsec{margin-top:18px}
.dl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:7px}
.links{display:grid;gap:7px;justify-items:start}

.links .none{color:var(--muted);font-size:13px}
.apis{display:flex;flex-wrap:wrap;gap:6px}

.apis a:hover{background:color-mix(in oklab,var(--c1) 17%,var(--ground))}
.facts{background:var(--panel);border-radius:14px;padding:15px 16px 16px;display:grid;gap:14px}

a{color:var(--link);text-decoration-thickness:1px;text-underline-offset:2px}

/* ================= phones and touch =================
   Below 900px the page stacks: title, picture, list. A short landscape screen keeps two columns and lets the page scroll,
   and the dialog puts its header beside its list. Touch screens get larger targets and pressed states in place of hover. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

.jump{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:30;display:inline-flex;align-items:center;gap:8px;max-width:calc(100% - 32px);min-height:44px;padding:0 14px 0 18px;border:0;border-radius:999px;background:var(--ink);color:var(--ground);font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 10px 26px -8px var(--shadow),0 0 0 1px color-mix(in oklab,var(--ground) 30%,transparent)}

<body>
<div class="wrap">
  <section class="stage" aria-label="The picture">

      <div class="pw who"><button class="sel empty" id="s-who" aria-haspopup="listbox" aria-expanded="false"><span id="i-who"></span><span class="st"><span class="sl">Who</span><span class="sv" id="v-who">Choose who you are</span></span><svg class="car" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div class="menu" id="m-who" role="listbox" aria-label="Who you are" hidden></div></div>
      <div class="pw grow"><button class="sel empty" id="s-out" aria-haspopup="listbox" aria-expanded="false"><span id="i-out"></span><span class="st"><span class="sl">Solution</span><span class="sv" id="v-out">Choose what to solve</span></span><svg class="car" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div class="menu" id="m-out" role="listbox" aria-label="What you want to solve" hidden></div></div>
      <button class="clr" id="clr" aria-label="Clear the selection" title="Clear" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="pic"><button class="again" id="again" aria-label="Back to the globe" title="Back to the globe" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><defs><radialGradient id="agg" cx="34%" cy="30%" r="80%"><stop offset="0" style="stop-color:var(--l3f)"/><stop offset="1" style="stop-color:var(--l2f)"/></radialGradient></defs><circle cx="10" cy="10" r="8.5" fill="url(#agg)"/><g fill="none" stroke="#fff" stroke-opacity=".7" stroke-width=".9"><ellipse cx="10" cy="10" rx="3.6" ry="8.5"/><path d="M1.5 10h17M3 5.6h14M3 14.4h14"/></g></svg></button><div id="pic"></div></div>
  </section>

  <div class="right">
    <header class="head">
      <h1>Mastercard <span class="os">Operating System</span></h1>

    P("healthcare","Healthcare & embedded finance","Named focus areas of Commercial & New Payment Flows on Mastercard's commercial pages.",{s:["corp","fin"],src:[["Commercial payments",M+"/us/en/business/payments/commercial-payments.html"]]}),

 {id:"L3", name:"Network services", analogy:"system services", color:"--l3",
  desc:"Services invoked around a payment on any rail: make the credential digital, prove who is paying, decide the risk, resolve what goes wrong, keep the account current — and, since 2025, let an AI agent do it.",
  tiles:[
   {id:"3.1", name:"Tokenisation & credentials", blurb:"Replace the card number.", div:"core", rev:"dig", products:[
    P("mdes","Mastercard Digital Enablement Service (MDES)","Core network tokenisation: replaces the PAN with device- or merchant-bound tokens for wallets, in-app, contactless and card-on-file.",{s:["iss","fin","mer"],lc:"before",src:[["MDES — Developers",D+"/product/mdes"]]}),
    P("scof","MDES for Merchants / Secure Card on File","Merchant and PSP tokenisation of stored credentials; live in 45 European countries by mid-2025.",{s:["mer","acq"],lc:"before",src:[["Secure Card on File",M+"/global/en/business/payments/commercial-payments/accept-payments/secure-card-on-file.html"]]}),
    P("tokenconnect","Token Connect & Pre-Digitization","Push-provisioning of tokens to merchants and wallets, and issuer- or token-requestor-initiated tokenisation flows.",{s:["iss","mer"],lc:"before",src:[["MDES Token Connect",D+"/mdes-token-connect/documentation/use-cases/push-to-merchant/"]]}),
    P("tas","Token Authentication Service (TAS)","Pairs a network token with OTP or passkey step-up inside Mastercard Gateway and Click to Pay. ('Token Authentication Framework' was not found as a product name.)",{s:["mer","acq"],lc:"checkout",src:[["TAS flow — Gateway docs",D+"/mastercard-gateway/documentation/security-and-fraud/authentication/token-auth-service/token-auth-service-flow/"]]}),
    P("onecred","Mastercard One Credential","One credential connected to debit, credit, prepaid and instalment funding with consumer-set preferences; partners Wio Bank, Marqeta, Lithic and Botim (Aug 2026).",{s:["iss","fin","con"],lc:"before",st:"new",ay:"2025",src:[["One Credential",M+"/global/en/business/payments/consumer-payments/next-gen-payments/mastercard-one-credential.html"]]}),
    P("digitalfirst","Digital First","End-to-end framework for instant digital issuance and a digital-native card experience; issuers saw +10% contactless and +8% tokenised transactions.",{s:["iss","fin"],lc:"before",ay:"2022",src:[["Digital First",M+"/global/en/business/payments/consumer-payments/next-gen-payments/digital-first.html"]]}),
    P("token2030","Tokenised e-commerce by 2030","Commitment (June 2024) to phase out manual card entry in European e-commerce by 2030; ~50% of European e-commerce transactions were tokenised by mid-2025. A goal, not a product.",{s:["iss","mer"],lc:"checkout",src:[["One-year update, Jun 2025","https://www.businesswire.com/news/home/20250603515548/en"]]}),
    P("vctokens","Mastercard Virtual Card Tokens","Tokenises browser-autofill card entries so saved cards in the browser are network tokens rather than PANs.",{s:["mer","fin","con"],lc:"checkout",src:[["Virtual Card Tokens — Developers",D+"/product/mastercard-virtual-card-tokens"]]}),
    P("walletservices","Mastercard Wallet Services","Fast contactless enablement and new use cases for wallet providers and banking apps that want to expand in digital payments.",{s:["fin","iss"],lc:"before",src:[["Wallet Services — Developers",D+"/product/mastercard-wallet-services"]]}),
    P("mcbp","MCBP MP SDK (Cloud-Based Payments)","SDK that simplifies building Mastercard Cloud-Based Payments wallet applications for Android and iOS.",{s:["fin","iss"],lc:"before",src:[["MCBP MP SDK — Developers",D+"/product/mobile-payments-sdk"]]}),
    P("par","Payment Account Reference Inquiry","Looks up the Payment Account Reference (PAR) for a PAN or MDES token where Mastercard is the BIN controller — linking tokens back to one account without exposing it.",{s:["mer","acq","iss"],lc:"after",src:[["PAR Inquiry — Developers",D+"/product/payment-account-reference-inquiry"]]}),
   ]},
   {id:"3.2", name:"Authentication & checkout", blurb:"Prove who is paying, without friction.", div:"core", rev:"dig", products:[
    P("idcheck","Mastercard Identity Check (EMV 3-D Secure)","Risk-based 3DS authentication, successor to SecureCode; 150+ data elements exchanged per authentication.",{s:["iss","mer","con"],lc:"checkout",src:[["Identity Check — Developers",D+"/product/identity-check/"]]}),
    P("smartauth","Smart Authentication · Identity Check Express · Stand-In RBA","Risk-based authentication targeting 90–95% frictionless decisions; a lighter flow launched in India (2019); Mastercard-performed RBA when the issuer's ACS is down.",{s:["iss"],lc:"checkout",src:[["Authentication",M+"/global/en/business/cybersecurity-fraud-prevention/identity/authentication.html"]]}),
    P("iift","Identity Insights for Transactions","Issuer–merchant data sharing at authorisation, including the Microsoft Dynamics 365 Fraud Protection partnership (+14% approvals). Formerly 'Digital Transaction Insights'.",{s:["iss","mer"],lc:"auth",st:"flux",src:[["Identity Insights for Transactions",M+"/us/en/business/cybersecurity-fraud-prevention/identity/insights/identity-insights-for-transactions.html"]]}),
    P("passkeys","Payment Passkeys","Device biometrics replace one-time passcodes at checkout; expanded to Asia Pacific in late 2024.",{s:["con","iss","mer"],lc:"checkout",st:"new",ay:"2024",src:[["Payment Passkeys",M+"/us/en/personal/ways-to-pay/payment-passkeys.html"]]}),
    P("c2p","Click to Pay (EMV Secure Remote Commerce)","Network-recognised guest checkout without typing card details; 26 European markets, enrolments doubled year-on-year in 2025.",{s:["mer","con","iss"],lc:"checkout",note:"Co-developed with the other networks at EMVCo.",src:[["Click to Pay",M+"/us/en/business/payments/commercial-payments/accept-payments/click-to-pay.html"]]}),
    P("biocheckout","Biometric Checkout Program","In-store pay-by-face or palm with identity partners such as NEC.",{s:["mer","con"],lc:"checkout",src:[["NEC press release, 2023","https://www.nec.com/en/press/202311/global_20231114_01.html"]]}),
    P("taponphone","Tap on Phone & Cloud Commerce","A smartphone becomes a contactless terminal; Cloud Commerce hosts ~90% of the tap-to-pay logic in the cloud.",{s:["mer","acq"],lc:"checkout",src:[["Tap on Phone",M+"/us/en/business/payments/commercial-payments/accept-payments/mobile-point-of-sale/tap-on-phone.html"],["Cloud Commerce",M+"/us/en/business/payments/commercial-payments/accept-payments/mobile-point-of-sale/cloud-commerce.html"]]}),
    P("qr","Mastercard QR & Merchant Presented QR","Consumer-initiated QR or alias payments, and merchant-presented QR acceptance at the point of sale.",{s:["mer","acq","con","fin"],lc:"checkout",src:[["Mastercard QR — Developers",D+"/product/mastercard-qr"],["Merchant Presented QR: SRC — Developers",D+"/product/mastercard-merchant-presented-qr-src"]]}),
    P("masterpass","Masterpass","Mastercard's first digital wallet; discontinued in 2019 in favour of Click to Pay and MDES.",{s:["con","mer"],lc:"checkout",st:"retired",src:[["Masterpass — Wikipedia","https://en.wikipedia.org/wiki/Masterpass"]]}),
   ]},
   {id:"3.3", name:"Risk decisioning", blurb:"Decide in milliseconds.", div:"svc", rev:"sec", products:[
    P("dmp","Decision Management Platform (DMP)","The decisioning platform — rules, case management and BI — that powers 20+ Mastercard products, evaluating thousands of rules in tens of milliseconds. Built on Brighterion AI.",{s:["iss","acq","mer"],lc:"auth",o:"A",ay:"2017",at:"Brighterion (engine)",rel:["brighterion","di","dipro","odd"],src:[["Brighterion technology","https://b2b.mastercard.com/ai-and-security-solutions/brighterion-ai/technology/"],["AI-powered decision management (blog)","https://b2b.mastercard.com/news-and-insights/blog/ai-powered-decision-management-key-for-global-credit-card-security/"]]}),
    P("di","Decision Intelligence (DI)","Real-time AI risk score on every transaction for issuers at authorisation.",{s:["iss"],lc:"auth",rel:["dmp"],src:[["Decision Intelligence",M+"/us/en/business/cybersecurity-fraud-prevention/risk-decisioning/decision-intelligence.html"]]}),
    P("dipro","Decision Intelligence Pro","Generative and graph-AI evolution (the MUCI algorithm) that scores transactions from any network; up to 300% uplift in detecting compromised cards.",{s:["iss"],lc:"auth",st:"new",ay:"Feb 2024",src:[["Press release, Feb 2024",M+"/us/en/news-and-trends/press/2024/february/mastercard-supercharges-consumer-protection-with-gen-ai.html"]]}),
    P("odd","On-Demand Decisioning","Issuers set their own authorisation rules directly on the network and choose auto-response or referral.",{s:["iss"],lc:"auth",st:"new",ay:"Oct 2025",src:[["Press release, Sep 2025",M+"/us/en/news-and-trends/press/2025/september/mastercard-customizable-decisioning-solution-for-financial-institutions.html"]]}),
    P("tfm","Transaction Fraud Monitoring (TFM) & A2A TFM","Pre-authorisation risk scores for acquirers, PSPs and payment facilitators, with a variant for account-to-account rails.",{s:["acq"],lc:"auth",src:[["Transaction Fraud Monitoring",M+"/global/en/business/cybersecurity-fraud-prevention/risk-decisioning/transaction-fraud-monitoring.html"]]}),
    P("ems","Expert Monitoring Solutions (EMS)","Behaviour-based card-not-present fraud score at authorisation for US-issued cards.",{s:["mer","acq"],lc:"auth",src:[["EMS via Cybersource docs","https://developer.cybersource.com/docs/cybs/en-us/payments/developer/ctv/rest/payments/payments-intro/payments-features-intro/payments-mc-ems.html"]]}),
    P("fma","Fraud Management Applications","Rule Discovery, Fraud Rule Manager and Case Manager: issuer self-service rule building and case handling on top of DI.",{s:["iss"],lc:"auth",src:[["Fraud Management Applications",M+"/global/en/business/cybersecurity-fraud-prevention/risk-decisioning/fraud-management-application.html"]]}),
    P("obrs","On-Behalf Rules Services","Mastercard-managed rule cartridges, tuned quarterly, for issuers without their own fraud-ops teams.",{s:["iss"],lc:"auth",src:[["On-Behalf Rules Services",M+"/us/en/business/cybersecurity-fraud-prevention/risk-decisioning/on-behalf-rules-services.html"]]}),
    P("merchrisk","Merchant Monitoring with AI · Merchant Risk Decisioning","Acquirer-side merchant risk products listed under Risk Decisioning.",{s:["acq"],src:[["Cybersecurity & fraud prevention hub",M+"/us/en/business/cybersecurity-fraud-prevention.html"]]}),
    P("matchpro","MATCH Pro","The Member Alert To Control High-risk merchants list, as an API: acquirers check a prospective merchant's history before signing an agreement.",{s:["acq"],lc:"before",src:[["MATCH Pro — Developers",D+"/product/match"]]}),
    P("orc","Onboard Risk Check","Merchant-onboarding risk assessment combining Mastercard data and third-party signals so acquirers and payfacs can decide who to board.",{s:["acq","fin"],lc:"before",src:[["Onboard Risk Check — Developers",D+"/product/onboard-risk-check"]]}),
    P("fld","Fraud and Loss Database (SAFE)","System of record for confirmed fraud filed by issuers; consumed by acquirers, the MATCH list and risk models.",{s:["iss","acq"],lc:"after",src:[["FLD — Developers",D+"/product/fld-fraud-submission/"]]}),
    P("medi","Mastercard Early Detect Insights (MEDI)","Authorisation anomaly and false-decline monitoring; the closest match to 'Alert Insights'.",{s:["iss","acq"],lc:"auth",rev:"ins",src:[["MEDI",M+"/us/en/business/insights-intelligence/operations-intelligence/solutions/mastercard-early-detect-insights.html"]]}),
    P("safetynet","Safety Net","Network-level fraud backstop (~2014) that blocks anomalous authorisation patterns even when an issuer has set no limits. No current public page found; may have been absorbed into On-Behalf Rules or DI.",{s:["iss"],lc:"auth",st:"unconf",div:"core"}),
   ]},
   {id:"3.4", name:"Disputes & resolution", blurb:"Fix what goes wrong, before it becomes a chargeback.", div:"svc", rev:"sec", products:[
    P("ethocaalerts","Ethoca Alerts","Near-real-time issuer↔merchant alerts so merchants can refund before a chargeback is filed; 39m chargebacks prevented in 2025.",{s:["mer","iss"],lc:"after",o:"A",ay:"2019",at:"Ethoca",src:[["Ethoca Alerts",M+"/us/en/business/cybersecurity-fraud-prevention/dispute-management/ethoca-alerts.html"]]}),
    P("ethocacc","Ethoca Consumer Clarity","Merchant purchase details and logos surfaced in banking apps and call centres to stop 'I don't recognise this' disputes.",{s:["iss","mer","con"],lc:"after",o:"A",ay:"2019",at:"Ethoca",src:[["Ethoca Consumer Clarity",M+"/global/en/business/cybersecurity-fraud-prevention/dispute-management/ethoca-consumer-clarity.html"]]}),
    P("ethocaelim","Ethoca Eliminator","Automated chargeback elimination on the Alerts network; thinly documented on Mastercard's own site.",{s:["mer"],lc:"after",st:"unconf",o:"A",ay:"2019",at:"Ethoca",src:[["Third-party explainer","https://corepay.net/articles/how-ethoca-eliminator-reduces-chargeback-and-prevents-fraud/"]]}),
    P("mastercom","Mastercom & Dispute Resolution","Core case-management system and the formal chargeback, pre-arbitration and arbitration framework.",{s:["iss","acq","mer"],lc:"after",src:[["Mastercom summary (PDF)",M+"/content/dam/public/mastercardcom/globalrisk/pdf/MastercomDisputeResolutionClaimsManagerExternalSummaryGLOBALJan20.pdf"]]}),
    P("fpt","First-Party Trust & Trusted Transactions","Merchant-shared trust and behavioural signals to fight friendly fraud; expanded to new markets in June 2025.",{s:["mer","iss"],lc:"after",st:"new",src:[["First-Party Trust expansion, Jun 2025",M+"/us/en/news-and-trends/press/2025/june/first-party-trust-countering-friendly-fraud.html"]]}),
    P("merchantid","Merchant Identifier","Resolves unrecognisable merchant names on statements to real merchant details — the classic cause of 'I don't recognise this charge' disputes.",{s:["iss","fin"],lc:"after",src:[["Merchant Identifier — Developers",D+"/product/merchant-identifier"]]}),
   ]},
   {id:"3.5", name:"Account services", blurb:"Keep the credential current; share what happens on it.", div:"core", rev:"dig", products:[
    P("abu","Automatic Billing Updater (ABU)","Pushes reissued card details to enrolled card-on-file merchants so recurring billing doesn't fail.",{s:["mer","iss","con"],lc:"after",src:[["ABU — Developers",D+"/product/automatic-billing-updater-abu/"]]}),
    P("asi","Account Status Inquiry & Payment Account Management","Card-validity checks and account-management APIs, documented mostly through processors' docs.",{s:["mer","acq"],lc:"before",src:[["Payment Account Management — Developers",D+"/product/payment-account-management"]]}),
    P("cardlc","Card lifecycle (Processing Core APIs)","Issuance, reissue, status changes and closure inside Mastercard Processing.",{s:["iss","fin"],lc:"before",rel:["processing"],src:[["Card lifecycle use case",D+"/mastercard-processing-core/documentation/use-cases/card-lifecycle/"]]}),
    P("minna","Minna Technologies","In-app subscription visibility, management and cancellation for banks' customers.",{s:["iss","con"],lc:"after",o:"A",ay:"Oct 2024",at:"Minna Technologies",rev:"eng",src:[["CNBC on the deal","https://www.cnbc.com/2024/10/01/mastercard-to-buy-subscription-management-startup-minna-technologies.html"]]}),
    P("alm","Account Level Management (ALM)","Named in the brief; no current Mastercard product found under this name (Marqeta uses it for its own tooling).",{s:["iss"],st:"unconf"}),
    P("txnnotif","Transaction Notifications","Real-time purchase alerts a cardholder can share with third-party apps and services, with consent managed through Mastercard's Consent Management & Enrollment APIs.",{s:["fin","iss","con"],lc:"after",src:[["Transaction Notifications — Developers",D+"/product/transaction-notifications"]]}),
    P("asc","Account Services Catalogue","One universal specification for account-range and PAN services — enablement, closure, replacement, product graduation and One Credential registration — routed to the right Mastercard service provider.",{s:["iss","fin"],lc:"before",src:[["Account Services Catalogue — Developers",D+"/product/account-services-catalogue"]]}),
    P("acctval","Mastercard Account Validation","Checks a cardholder's name against the issuer's records in real time, for account opening and transaction protection.",{s:["mer","fin","iss"],lc:"before",src:[["Account Validation — Developers",D+"/product/mastercard-account-validation"]]}),
   ]},
   {id:"3.6", name:"Agentic commerce", blurb:"Let an AI agent pay — safely.", div:"core", rev:"dig", products:[
    P("agentpay","Mastercard Agent Pay","Framework for AI agents to transact on a person's or business's behalf: trusted agent registration, safe transactions, consumer control and fraud protection. Partners include Microsoft, IBM, PayPal, Google, Braintree and Checkout.com.",{s:["ai","mer","iss","con"],lc:"checkout",st:"new",ay:"Apr 2025",rel:["agentictokens","kya","vintent","ap4m","agentsuite"],src:[["Agent Pay unveiled, Apr 2025",M+"/global/en/news-and-trends/press/2025/april/mastercard-unveils-agent-pay-pioneering-agentic-payments-technology-to-power-commerce-in-the-age-of-ai.html"],["Agent Pay product page",M+"/global/en/business/artificial-intelligence/mastercard-agent-pay.html"]]}),
    P("agentictokens","Agentic Tokens","MDES-derived tokens that carry which agent is acting and on whose behalf, end to end.",{s:["ai","iss","mer"],lc:"checkout",st:"new",ay:"2025",rel:["mdes"],src:[["Agentic commerce momentum",M+"/global/en/news-and-trends/stories/2025/agentic-commerce-momentum.html"]]}),
    P("kya","Know Your Agent (KYA)","Registration and verification so only vetted, traceable agents can obtain agentic tokens — 'KYC for AI agents'.",{s:["ai","iss"],lc:"before",st:"new",ay:"2025",src:[["Checkout.com interview","https://www.checkout.com/blog/mastercard-checkout-discuss-agentic-commerce-agent-pay"]]}),
    P("vintent","Verifiable Intent","Open, standards-based proof that an agent acted within explicit consumer authorisation; co-developed with Google (AP2/UCP-aligned). Interoperability talks with Visa's Trusted Agent Protocol, September 2026.",{s:["ai","mer","iss","con"],lc:"checkout",st:"new",ay:"Mar 2026",src:[["Verifiable Intent",M+"/global/en/news-and-trends/stories/2026/verifiable-intent.html"],["Finextra: Verifiable Intent vs Visa TAP","https://www.finextra.com/blogposting/31107/deep-dive-mastercard-verifiable-intent-vs-visa-trusted-agent-protocol"]]}),
    P("ap4m","Agent Pay for Machines (AP4M)","Machine-to-machine, high-frequency, low-value payments across cards, accounts and stablecoins; 30+ launch partners including Stripe, Adyen, Coinbase and the Solana Foundation.",{s:["ai","corp"],lc:"checkout",st:"new",ay:"Jun 2026",src:[["Launch press release, Jun 2026",M+"/global/en/news-and-trends/press/2026/june/mastercard-launches-agent-pay-for-machines.html"]]}),
    P("agentsign","'Agent Sign' / 'Verified Agents'","Not found as official names; the functional equivalents are Know Your Agent and Verifiable Intent.",{s:["ai"],st:"unconf",rel:["kya","vintent"]}),

 {id:"L2", name:"Rails", analogy:"drivers · I/O", color:"--l2",
  desc:"Mastercard is multi-rail: six ways money and account data move, all plugging into the same kernel and able to call the same network services. Cards earn Payment network revenue; the other rails report inside Value-added services.",

    P("a2astack","Instant Payment Service · Bulk Payment Service · Proxy Directory Service · Pay by Account","The productised account-to-account stack Mastercard markets to banks and central infrastructures.",{s:["iss","gov"],lc:"settle",src:[["b2b.mastercard.com","https://b2b.mastercard.com/"]]}),

/* ---------- isometric geometry ---------- */
const S=24, C=0.866, T=1.5, GAP=3.4, GP=GAP*S, OX=240, OY=536, UZ=2.6;

const KX=1.2247*S, KY=.7071*S, R=6.6, RX=R*KX, RY=R*KY, RP=5.3, PR=.85, PH=.42, RB=3.6, UR=3.6, DEG=Math.PI/180;

const f=n=>(Math.round(n*10)/10);
const pts=a=>a.map(p=>f(p[0])+","+f(p[1])).join(" ");
const poly=(a,cls,fill,extra)=>`<polygon class="${cls}" points="${pts(a)}"${fill?` fill="${fill}"`:""}${extra||""}/>`;
const f2=n=>Math.round(n*100)/100;
const G=(rho,th)=>{ const a=(th-45)*DEG; return [5+rho*Math.cos(a),5+rho*Math.sin(a)]; };
/* Areas sit on the front arc, split either side of the centre line the vertical connection runs down, so all of them stay in view once the slices separate. */
function shapes(L){
  const t=L.tiles, nl=Math.ceil(t.length/2);

}
function plane(z){ return `matrix(${f2(C*S)},${S/2},${-f2(C*S)},${S/2},${OX},${f(OY-z*S)})`; }
function icon(name,cx,cy,z,size,k){
  return `<g class="ico" style="stroke:color-mix(in oklab,var(--l${k}f),#000 62%)" transform="${plane(z)} translate(${f2(cx-size/2)},${f2(cy-size/2)}) scale(${f(size/24*10000)/10000})">${ICONS[name]}</g>`;

function drawShape(L,s,zt){

/* The unlit circuit on each disc: a ring bus, a stub to every pad, and a trace from the hub out to the front rim. */
function decor(L,zt,sh){

    h+=`</defs><g class="tower" style="--c:${f(2*GP)}"><ellipse class="shadow" filter="url(#soft)" cx="${OX}" cy="${f(OY+120+20)}" rx="${f(RX+8)}" ry="${f(RY+4)}"/>`;
  LAYERS.forEach((L,i)=>{
    const zb=i*T, zt=zb+T, k=L.k, top=i===n-1, cy=OY+120-zt*S; BASE[i]=cy;
    const side=`M${f(OX-RX)},${f(cy)}v${f(ts)}A${f(RX)},${f(RY)} 0 0 0 ${f(OX+RX)},${f(cy+ts)}v${f(-ts)}A${f(RX)},${f(RY)} 0 0 1 ${f(OX-RX)},${f(cy)}z`;

    if(wide){const x=OX+RX, y=cy+ts/2;h+=`<g class="lbl"><line x1="${f(x+6)}" y1="${f(y)}" x2="${f(x+28)}" y2="${f(y)}"/><text x="${f(x+36)}" y="${f(y+5)}"><tspan class="lid" style="fill:var(--l${k})">${L.id}</tspan><tspan class="ln" dx="8">${L.name}</tspan></text><text class="lc" x="${f(x+36)}" y="${f(y+22)}">${L.tiles.length} areas · ${L.total} products</text></g>`;}
    h+=`</g></g>`;

  if(wide){const x=OX+ua, lx=OX+RX+36;h+=`<g class="lbl"><line x1="${f(x+14)}" y1="${f(uy)}" x2="${f(lx-8)}" y2="${f(uy)}"/><text x="${f(lx)}" y="${f(uy+5)}"><tspan class="ln">Users</tspan><tspan class="lid" dx="8" style="fill:var(--muted)">8 kinds</tspan></text></g>`;}

/* ---------- state ---------- */
const st={e:0,p:1,open:false,focus:null,wide:null,who:null,out:null,menu:null};
let PADS={}, BASE=[], UPOS=null, UTOK={}, raf=0;
const TILE={}; LAYERS.forEach(L=>L.tiles.forEach(t=>{t.L=L;TILE[t.id]=t;}));
const reduce=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const curOut=()=>OUTCOMES.find(o=>o.id===st.out)||null;
function applyPic(){
  const svg=$("#svg"); if(!svg) return;
  const o=curOut(), flow=!!o&&!st.focus, lit={};
  if(o) o.steps.forEach(s=>{lit[s.at]=1;});
  svg.style.setProperty("--e",f(st.e*1000)/1000);
  svg.classList.toggle("hasfocus",!!st.focus);
  svg.classList.toggle("hasflow",flow);
  svg.querySelectorAll(".layer").forEach(g=>{ const id=g.dataset.l; g.classList.toggle("focus",id===st.focus); g.classList.toggle("app",flow&&(id==="U"||o.steps.some(s=>TILE[s.at]&&TILE[s.at].L.id===id))); });
  svg.querySelectorAll(".blk").forEach(b=>b.classList.toggle("on",flow&&!!lit[b.dataset.t]));
  svg.querySelectorAll(".utok").forEach(t=>t.classList.toggle("me",flow&&t.dataset.u===o.who));
  drawFlow();
}
/* The flow lights the circuit: from you, down the centre line, round each disc's ring bus and out along a stub to every area in the order it acts. */
function drawFlow(){
  const g=$("#flow"); if(!g) return;
  const o=curOut();
  if(!o||st.focus||st.e<.55||!UPOS){ g.innerHTML=""; return; }
  const e=st.e, top=LAYERS.length-1, cyT=i=>BASE[i]-i*GP*e, A=RB*KX, B=RB*KY, cos=t=>Math.cos(t*DEG), sin=t=>Math.sin(t*DEG);
  const bus=(i,t)=>[OX+A*cos(t),cyT(i)+B*sin(t)], hub=i=>[OX,cyT(i)+B], rim=i=>[OX,cyT(i)+RY], under=i=>[OX,cyT(i)+RY+T*S];
  const end=p=>[OX+(RP-PR)*KX*cos(p.th),cyT(p.i)+(RP-PR)*KY*sin(p.th)-PH*S];
  let d="", cur={i:top,th:90}, atPad=false, last=null; const by={};
  const M=q=>{d+="M"+f(q[0])+","+f(q[1]);}, Ln=q=>{d+="L"+f(q[0])+","+f(q[1]);};
  const arc=(i,a,b)=>{ if(a===b) return; const q=bus(i,b); d+=`A${f(A)},${f(B)} 0 0 ${b>a?1:0} ${f(q[0])},${f(q[1])}`; };
  /* Between discs the connection is drawn in the gaps only; it passes behind each disc's edge. */
  const travel=(a,b)=>{ if(b<a) for(let k=a;k>b;k--){ Ln(rim(k)); M(under(k)); Ln(hub(k-1)); } else for(let k=a;k<b;k++){ Ln(under(k+1)); M(rim(k+1)); Ln(hub(k+1)); } };
  const tk=UTOK[o.who]||UPOS, u=[tk.x,tk.y-UPOS.i*GP*e], h0=hub(top), ul=Math.hypot(h0[0]-u[0],h0[1]-u[1])||1;
  M([u[0]+(h0[0]-u[0])/ul*15,u[1]+(h0[1]-u[1])/ul*15]); Ln(h0);
  o.steps.forEach((s,n)=>{ const p=PADS[s.at]; if(!p) return; (by[s.at]=by[s.at]||{p,nums:[]}).nums.push(n+1); if(last===s.at) return; last=s.at;
    if(atPad) Ln(bus(cur.i,cur.th));

      ${(p.api&&p.api.length)?`<div class="dsec"><div class="dl">Developer APIs</div><div class="apis">${p.api.map(a=>`<a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(a.n)}</a>`).join("")}</div></div>`:""}
      <div class="dsec"><div class="dl">Sources</div><div class="links">${srcs}</div></div>
      ${rel?`<div class="dsec"><div class="dl">Related</div><div class="chips">${rel}</div></div>`:""}
    </div>
    <div class="facts">
      <div class="fact"><div class="dl">Serves</div><div class="serves">${p.s.length? p.s.map(k=>`<span>${svgi(UICON[k],"")}${esc(M.USERS[k])}</span>`).join("") : `<span>No one user in particular</span>`}</div></div>
      <div class="fact"><div class="dl">Where it acts</div><div class="track" role="img" aria-label="Stage ${at+1} of 6">${LCK.map((k,i)=>`<i${i===at?' class="on"':""}></i>`).join("")}</div><div class="dv">${esc(M.LC[p.lc])}</div></div>
      <div class="fact"><div class="dl">Origin</div><div class="dv">${origin}</div></div>
      <div class="fact"><div class="dl">Status</div><div class="dv">${esc(M.ST[p.st])}</div></div>
      <div class="fact"><div class="dl">Sold through</div><div class="dv">${esc(M.DIV[p.div]||"Not assigned")}<small>${esc(M.REV[p.rev]||"")}</small></div></div>
    </div>
  </div>`;
  d.querySelectorAll("[data-rel]").forEach(b=>b.addEventListener("click",()=>openProduct(M.PRODUCTS[b.dataset.rel])));
  d.querySelectorAll("[data-o]").forEach(b=>b.addEventListener("click",()=>{ closeDrawer(); pickOut(b.dataset.o); }));
  return d;
}
function layerCrumb(L){ return {t:L.name,fn:()=>{ closeDrawer(); setFocus(L.id); }}; }
function openTile(T){
  if(!T) return;
  const L=T.layer, hd=headOf(T);
  const live=T.products.filter(p=>p.st!=="retired"), gone=T.products.filter(p=>p.st==="retired");
  const nNew=live.filter(p=>p.st==="new").length, nAcq=live.filter(p=>p.o==="A").length, nApi=live.reduce((n,p)=>n+((p.api&&p.api.length)||0),0);
  const stat=(n,l)=>n?`<span class="stat"><b>${n}</b>${l}</span>`:"";
  setHead([{t:"Stack",fn:closeDrawer},hd.pil?{t:"Pillars"}:layerCrumb(L),{t:T.name}],
    Object.assign(hd,{lid:hd.pil?"Cross-cutting pillar":L.name+" · "+L.analogy, title:T.name, lead:T.blurb,
      stats:stat(live.length,live.length===1?"product":"products")+stat(nNew,"new in 2025–26")+stat(nAcq,"acquired")+stat(nApi,nApi===1?"developer API":"developer APIs")+stat(gone.length,"retired")}));
  const body=$("#dbody"); body.innerHTML="";
  const list=el("div","plist"); live.forEach(p=>list.appendChild(productCard(p))); body.appendChild(list);
  if(gone.length){ body.appendChild(el("h4","","Retired or divested")); const g=el("div","plist"); gone.forEach(p=>g.appendChild(productCard(p))); body.appendChild(g); }
  if(T.id==="5.1"){
    body.appendChild(el("h4","",`API catalogue: ${MAP.ALL_APIS.length} products on developer.mastercard.com, by home layer`));
    const groups={}; MAP.ALL_APIS.forEach(a=>{ const L2=a.p.tile.layer; (groups[L2.id]=groups[L2.id]||{L:L2,items:[]}).items.push(a); });
    ["L1","L2","L3","L4","L5","P"].forEach(k=>{ const g=groups[k]; if(!g) return; const h=el("div","apigrp"); h.innerHTML=`<div class="apih" style="--lc:var(${g.L.color}f)">${esc(g.L.name)} · ${g.items.length}</div>`; const ul=el("div","apilist");
      g.items.sort((a,b)=>a.n.localeCompare(b.n)).forEach(a=>{ const r=el("div","apirow"); r.innerHTML=`<a href="${esc(a.u)}" target="_blank" rel="noopener">${esc(a.n)}</a><button class="apihome" data-p="${a.p.id}">${esc(a.p.tile.id.startsWith("pillar")?"Pillar":a.p.tile.id)} · ${esc(a.p.n)}</button>`; ul.appendChild(r); });
      h.appendChild(ul); body.appendChild(h); });
    body.querySelectorAll(".apihome").forEach(b=>b.addEventListener("click",()=>openProduct(MAP.PRODUCTS[b.dataset.p])));
  }
  if(T.id==="4.6"){ body.appendChild(el("h4","","Also AI, elsewhere on the map")); const sa=el("div","chips"); ["agentpay","dipro","dy","practices","merchantcloud"].forEach(id=>{ const b=el("button","",esc(MAP.PRODUCTS[id].n)); b.addEventListener("click",()=>openProduct(MAP.PRODUCTS[id])); sa.appendChild(b); }); body.appendChild(sa); }
  openDrawer(); body.scrollTop=0;
}
function openProduct(p){
  if(!p) return;
  const T=p.tile, L=T.layer, hd=headOf(T);
  setHead([{t:"Stack",fn:closeDrawer},hd.pil?{t:"Pillars"}:layerCrumb(L),{t:T.name,fn:()=>openTile(T)},{t:p.n}],
    Object.assign(hd,{lid:T.name+(hd.pil?" · Cross-cutting pillar":" · "+L.name), title:p.n, lead:"", stats:tagHtml(p), badges:true}));
  const body=$("#dbody"); body.innerHTML="";
  body.appendChild(detailHtml(p,true));
  const sib=T.products.filter(x=>x!==p&&x.st!=="retired");
  if(sib.length){ body.appendChild(el("h4","",`Also in ${esc(T.name)}`)); const l2=el("div","plist"); sib.forEach(x=>l2.appendChild(productCard(x))); body.appendChild(l2); }
  openDrawer(); body.scrollTop=0;
}
$("#close").addEventListener("click",closeDrawer); scrimEl.addEventListener("click",closeDrawer);

const beside=window.matchMedia?matchMedia("(orientation:landscape) and (max-height:540px) and (min-width:561px) and (max-width:1000px)"):{matches:false};
$("#dbody").addEventListener("scroll",function(){ if(beside.matches){ dlgEl.classList.remove("scrolled"); return; } const y=this.scrollTop; if(y>28) dlgEl.classList.add("scrolled"); else if(y<=0) dlgEl.classList.remove("scrolled"); },{passive:true});
/* ---------- events ---------- */
/* The stack is its own control: a click opens it, a click on an area opens that area's products, a click on a slice lists its areas. */
$("#again").addEventListener("click",backToDisc);
$("#pic").addEventListener("click",e=>{
  if(st.p<1){ if(st.p<=0&&!iraf&&e.target.closest("#intro")) runIntro(1); return; }
  const g=e.target.closest(".layer");
  if(!st.open){ if(g) openStack(); return; }
  if(!g){ if(st.focus) setFocus(null); else if(!st.out) closeStack(); return; }
  const b=e.target.closest("[data-t]");
  if(b){ openTile(MAP.TILES[b.dataset.t]); return; }
  setFocus(st.focus===g.dataset.l?null:g.dataset.l);
});
$("#pic").addEventListener("keydown",e=>{ if(e.key!=="Enter"&&e.key!==" ") return; const g=e.target.closest(".layer"); if(!g) return; e.preventDefault(); const id=g.dataset.l; if(!st.open) openStack(); else setFocus(st.focus===id?null:id); const n=document.querySelector(`.layer[data-l="${id}"]`); if(n) n.focus(); });
const canHover=!!(window.matchMedia&&matchMedia("(hover:hover)").matches);
$("#pic").addEventListener("mouseover",e=>{
  if(st.p<1) return;
  const g=e.target.closest(".layer");
  if(!st.open){ if(g&&canHover&&st.e<.05) setE(.09,false,260); return; }
  const b=e.target.closest("[data-t]"); if(!b||!g||!canHover) return;
  if((st.focus&&g.dataset.l===st.focus)||(!st.focus&&b.classList.contains("on"))) hot(b.dataset.t);
});
$("#pic").addEventListener("mouseleave",()=>{ if(!st.open&&st.e>0) setE(0,false,260); });
$("#side").addEventListener("click",e=>{
  const go=e.target.closest("[data-go]"), t=e.target.closest(".tile"), sp=e.target.closest(".step");
  if(go){ setFocus(go.dataset.go||null); if($("#side").getBoundingClientRect().top<0) $("#side").scrollIntoView({block:"start"}); } else if(t) openTile(MAP.TILES[t.dataset.t]); else if(sp) openProduct(MAP.PRODUCTS[sp.dataset.p]);
});
$("#side").addEventListener("keydown",e=>{ const sp=e.target.closest(".step"); if(sp&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); openProduct(MAP.PRODUCTS[sp.dataset.p]); } });
$("#side").addEventListener("mouseover",e=>{ if(!canHover) return; const r=e.target.closest(".tile,.step"); if(r&&r.dataset.t) hot(r.dataset.t);});
$("#side").addEventListener("mouseleave",()=>hot(null));
$("#pick").addEventListener("click",e=>{
  e.stopPropagation();
  const w=e.target.closest("[data-who]"), o=e.target.closest("[data-out]");
  if(w) pickWho(w.dataset.who); else if(o) pickOut(o.dataset.out);
  else if(e.target.closest("#s-who")) openMenu("who"); else if(e.target.closest("#s-out")) openMenu("out");
  else if(e.target.closest("#clr")) clearPick();
});
document.addEventListener("click",e=>{ if(st.menu&&!e.target.closest("#pick")){ st.menu=null; renderPick(); } });
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(drawerOpen()) closeDrawer();
  else if(st.menu){ const m=st.menu; st.menu=null; renderPick(); $("#s-"+m).focus(); }
  else if(st.focus) setFocus(null);
  else if(st.open&&!st.out) closeStack();
});
window.addEventListener("resize",()=>{ layout(); updateJump(); });
let jraf=0; window.addEventListener("scroll",()=>{ if(!jraf) jraf=requestAnimationFrame(()=>{ jraf=0; updateJump(); }); },{passive:true});
$("#jump").addEventListener("click",()=>$("#side").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"}));
if(!canHover){ const sub=$(".sub"); if(sub) sub.textContent=sub.textContent.replace("Click the stack","Tap the stack"); }
OUTCOMES.forEach(O=>O.steps.forEach(s=>{ const pr=MAP.PRODUCTS[s.p]; if(!pr||pr.tile.id!==s.at) console.warn("outcome step does not match the inventory:",O.id,s.p,s.at); }));
LAYERS.forEach(L=>L.tiles.forEach(t=>{ const T=MAP.TILES[t.id]; if(!T) console.warn("area missing from the inventory:",t.id); else t.c=T.products.filter(x=>x.st!=="retired").length; }));
LAYERS.forEach(L=>{ L.total=L.tiles.reduce((n,t)=>n+t.c,0); });
const h0=(location.hash||"").slice(1);
st.p=(h0||reduce)?1:0;
layout(); renderPick(); renderSide(); applyIntro();
if(h0==="open"||h0==="sliced") openStack(); else if(h0==="U"||LAYERS.some(l=>l.id===h0)) setFocus(h0); else if(/^o-/.test(h0)) pickOut(h0.slice(2));
else if(st.p<1){
  let armed=false;
  const arm=()=>{ if(armed||st.p>0) return; const r=$("#pic").getBoundingClientRect(); if(r.bottom<=0||r.top+r.height*.8>window.innerHeight) return;
    armed=true; window.removeEventListener("scroll",arm); window.removeEventListener("resize",arm); setTimeout(()=>{ if(st.p<=0) runIntro(1); },2200); };
  window.addEventListener("scroll",arm,{passive:true}); window.addEventListener("resize",arm); arm();
}
</script>
</body>
